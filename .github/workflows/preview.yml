name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Cleanup preview on PR close
        if: github.event.action == 'closed'
        run: |
          echo "PR closed - preview deployment will remain but can be manually deleted if needed"
          echo "To manually delete: wrangler delete --name brentkirklandcom-pr-${{ github.event.pull_request.number }}"
        
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 24
          cache: npm
          
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci
        
      - name: Deploy preview
        if: github.event.action != 'closed'
        id: deploy
        run: |
          # Deploy with a unique name for this PR
          WORKER_NAME="brentkirklandcom-pr-${{ github.event.pull_request.number }}"
          npx wrangler deploy --name "$WORKER_NAME" --env preview
          
          # Construct the preview URL
          PREVIEW_URL="https://${WORKER_NAME}.brentkirkland.workers.dev"
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
      - name: Comment preview URL on PR
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const prNumber = context.issue.number;
            
            // Find existing preview comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview deployment')
            );
            
            const body = `## 🚀 Preview deployment ready!
            
Your preview is available at: ${previewUrl}

This preview will be automatically updated when you push new commits to this PR.`;
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
