name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          
      - name: Install dependencies
        run: npm ci
      
      - name: Delete preview worker on PR close
        if: github.event.action == 'closed'
        run: |
          WORKER_NAME="brentkirklandcom-pr-${{ github.event.pull_request.number }}"
          echo "Deleting preview worker: $WORKER_NAME"
          npx wrangler delete --name "$WORKER_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Post cleanup comment
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '🧹 Preview deployment has been cleaned up and deleted.'
            });
        
      - name: Deploy preview
        if: github.event.action != 'closed'
        id: deploy
        run: |
          # Deploy with a unique name for this PR
          WORKER_NAME="brentkirklandcom-pr-${{ github.event.pull_request.number }}"
          
          # Deploy and capture the output
          DEPLOY_OUTPUT=$(npx wrangler deploy --name "$WORKER_NAME" --env preview 2>&1)
          echo "$DEPLOY_OUTPUT"
          
          # Extract the actual preview URL from wrangler output
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[^\s]+\.workers\.dev' | head -1)
          
          if [ -z "$PREVIEW_URL" ]; then
            echo "Warning: Could not extract preview URL from wrangler output"
            PREVIEW_URL="https://${WORKER_NAME}.workers.dev"
          fi
          
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
      - name: Comment preview URL on PR
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const prNumber = context.issue.number;
            
            // Find existing preview comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview deployment')
            );
            
            const body = `## 🚀 Preview deployment ready!\n\nYour preview is available at: ${previewUrl}\n\nThis preview will be automatically updated when you push new commits to this PR.`;
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
